# WebSocket: define Connection correto
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8000;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # --- CLIENTE ---
    # deixe sem limite aqui (evita 413 esquisito no handshake)
    client_max_body_size 0;

    # buffers maiores (cookie/header grande -> não quebra handshake)
    client_header_buffer_size 64k;
    large_client_header_buffers 8 64k;

    # --- LOGS ---
    error_log  stderr warn;
    access_log /dev/stdout main;

    # --- APP ---
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- PHP-FPM ---
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # --- WEBSOCKET (REVERB / PUSHER) ---
    location ^~ /app/ {
        # não limita / não bufferiza websocket
        client_max_body_size 0;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;

        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # pusher pode usar isso
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript image/svg+xml;

    location ~ /\. {
        deny all;
    }
}